name: GitHub CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  feature_1_elso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install test dependency
        run: pip install pytest

      - name: Run test_display_uncovered_field
        run: |
          set -o pipefail
          mkdir -p logs
          pytest test/test_minesweeper_flagging.py::test_display_uncovered_field | tee logs/display_uncovered_field.log

      - name: Upload display_uncovered_field log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: display-uncovered-field-log
          path: logs/display_uncovered_field.log
          if-no-files-found: ignore
          retention-days: 14

  feature_1_masodik:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
